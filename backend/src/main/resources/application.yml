spring:
  application:
    name: codecompass-ai

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL datasource (local Docker or cloud Neon)
  # ──────────────────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codecompass}
    username: ${SPRING_DATASOURCE_USERNAME:codecompass}
    password: ${SPRING_DATASOURCE_PASSWORD:codecompass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000      # allow time for Neon to wake from autosuspend
      keepalive-time: 120000         # ping idle connections every 2 min
      max-lifetime: 600000           # recycle connections every 10 min

  jpa:
    hibernate:
      ddl-auto: update          # auto-creates/updates tables from entities
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ──────────────────────────────────────────────────────────────────────────
  # Jackson
  # ──────────────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

# ────────────────────────────────────────────────────────────────────────────
# Server – dynamic port binding for Render ($PORT) with fallback to 8080
# ────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}

# ────────────────────────────────────────────────────────────────────────────
# Actuator – expose health and info endpoints
# ────────────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ────────────────────────────────────────────────────────────────────────────
# LangChain4j – OpenAI-compatible client → Groq API
#
# The Groq API is OpenAI-compatible; we point the base-url at Groq's endpoint.
# Set GROQ_API_KEY as an environment variable before running.
#
# Model history:
#   llama-3.3-70b-versatile — original choice (Stage 1); removed from Groq
#                             free tier as of 2026-09 (404 model_not_found).
#   groq/compound           — accidentally set during Stage 4 (Compound Beta
#                             routing agent, NOT a direct LLM; caused 413 at
#                             topK>=3 due to smaller effective context window).
#   qwen/qwen3.8-27b        — current model (Stage 4 fix, 2026-09-18).
#                             131K context, real LLM, Groq free tier.
#
# NOTE: Do NOT silently change model-name without explicit user approval.
# ────────────────────────────────────────────────────────────────────────────
langchain4j:
  open-ai:
    chat-model:
      api-key: ${GROQ_API_KEY:GROQ_API_KEY_NOT_SET}
      base-url: https://api.groq.com/openai/v1
      model-name: qwen/qwen3.8-27b
      temperature: 0.3
      max-tokens: 2048
      log-requests: false
      log-responses: false

  # ──────────────────────────────────────────────────────────────────────────
  # LangChain4j – Google Gemini (hosted embedding model)
  #
  # Model  : gemini-embedding-001 (output_dimensionality=768 via EmbeddingConfig)
  # Key    : obtain from https://aistudio.google.com/app/apikey  (no card needed)
  # Set    : GEMINI_API_KEY environment variable before running
  #
  # NOTE: langchain4j-google-ai-gemini is NOT a Spring Boot auto-configure
  # starter, so there is no langchain4j.google-ai-gemini.* auto-config.
  # The EmbeddingModel bean is wired manually in EmbeddingConfig.java.
  # ──────────────────────────────────────────────────────────────────────────

# ────────────────────────────────────────────────────────────────────────────
# Gemini API
# Injected into EmbeddingConfig via @Value("${gemini.api-key}").
# ────────────────────────────────────────────────────────────────────────────
gemini:
  api-key: ${GEMINI_API_KEY:GEMINI_API_KEY_NOT_SET}

# ────────────────────────────────────────────────────────────────────────────
# [DISABLED – local dev only] LangChain4j – Ollama
# To restore Ollama locally: re-add langchain4j-ollama-spring-boot-starter to
# pom.xml and uncomment the block below. The vector(768) column is compatible
# since nomic-embed-text also produces 768-dim vectors.
# ────────────────────────────────────────────────────────────────────────────
# langchain4j:
#   ollama:
#     embedding-model:
#       base-url: http://localhost:11434
#       model-name: nomic-embed-text
#       log-requests: false
#       log-responses: false

# ────────────────────────────────────────────────────────────────────────────
# CodeCompass custom properties
# ────────────────────────────────────────────────────────────────────────────
codecompass:
  # Persistent cache directory for Git repository clones.
  # Clones are kept after ingestion so Impact Analysis and API Explorer
  # can read source files on demand. Re-ingesting the same URL replaces
  # the old clone with a fresh one. Added to .gitignore.
  clone-base-dir: ${user.dir}/.repo-cache

  # pgvector embedding store settings
  pgvector:
    dimension: 768          # gemini-embedding-001 outputDimensionality=768 (MRL-configurable; matches vector(768) column)
    index-type: IVFFLAT
    table-name: code_embeddings

  # RAG retrieval
  rag:
    max-results: 10         # hard ceiling on chunks retrieved per query
    min-score: 0.6          # minimum cosine similarity threshold (reserved for Stage 5+)
    default-top-k: 5        # default number of chunks retrieved per /api/qa call
    max-chunk-chars: 2000   # per-chunk content cap before prompting (~500 tokens @ 4 chars/token)
                            # prevents 413 "request too large" errors when topK ≥ 3

  # CORS configuration for local dev and cloud deployments (Vercel)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,https://*.vercel.app}

  # Embedding provider toggle + rate-limit parameters
  #   provider: ollama (local default, nomic-embed-text, no throttling)
  #             gemini (deployment; set CODECOMPASS_EMBEDDING_PROVIDER=gemini on Render)
  # delay-ms / rate-limit-retry-delay-ms only apply to the gemini provider
  # (free-tier 15 RPM protection); they are ignored for ollama.
  embedding:
    provider: ${CODECOMPASS_EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: nomic-embed-text
    delay-ms: ${CODECOMPASS_EMBEDDING_DELAY_MS:4100}
    rate-limit-retry-delay-ms: ${CODECOMPASS_EMBEDDING_RETRY_DELAY_MS:65000}

